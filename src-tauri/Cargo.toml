[package]
name = "lerdr"
version = "0.25.0"
description = "Native Android shell for the Lerdr web app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lerdr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The Android .so ships uncompressed inside the APK; the default release
# profile keeps full symbols and generic codegen (~11.6 MB). Size-tuned flags
# cut that roughly in half — the shell's Rust side is thin plugin dispatch,
# so binary size beats peak codegen here.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
opt-level = "z"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-haptics = "2"
tauri-plugin-barcode-scanner = "2"
tauri-plugin-biometric = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-deep-link = "2"
