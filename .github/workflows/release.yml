name: release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Require successful check workflow
    runs-on: ubuntu-latest
    steps:
      - name: Require successful check workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            state="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow check.yml \
                --commit "$GITHUB_SHA" \
                --limit 20 \
                --json status,conclusion \
                --jq '
                  if any(.[]; .conclusion == "success") then "success"
                  elif length == 0 or any(.[]; .status != "completed") then "pending"
                  else "failed"
                  end
                '
            )"
            case "$state" in
              success)
                exit 0
                ;;
              failed)
                echo "Tagged commit $GITHUB_SHA has no successful check.yml run." >&2
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for check.yml on tagged commit $GITHUB_SHA." >&2
          exit 1

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --cwd frontend
      - name: Build release bundles
        run: |
          make cross-build
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml)"
          test "$version" = "$manifest_version" || {
            echo "Tag version $version does not match plugin version $manifest_version." >&2
            exit 1
          }
          scripts/package-release.sh "$version" "$GITHUB_SHA" dist/release
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundles
          path: dist/release/
          retention-days: 1

  native-smoke:
    name: Native release smoke (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-15-intel
            target: darwin_amd64
          - runner: macos-15
            target: darwin_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-bundles
          path: dist/release
      - name: Exercise packaged relay on its native target
        run: |
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          scripts/check-installed-release.sh \
            "dist/release/lerdr_${version}_${{ matrix.target }}.tar.gz" \
            dist/release/checksums.txt "$version" "$GITHUB_SHA" \
            "${target%_*}/${target#*_}"

  mobile:
    # Temporarily disabled while the installed-device harness is fixed on ci-mobile.
    if: ${{ false }}
    needs: build
    uses: ./.github/workflows/mobile-ci.yml
    with:
      artifact_run_id: ${{ github.run_id }}
      artifact_name: release-bundles
      candidate_commit: ${{ github.sha }}
      head_commit: ${{ github.sha }}
      platform: all
      suite: release
      baseline_set: all
    permissions:
      actions: read
      contents: read

  android-apk:
    name: Android APK (universal)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: bun install --frozen-lockfile --cwd frontend
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Ensure Android NDK r28
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "ndk;$NDK_VERSION" "build-tools;35.0.0" "platforms;android-35"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Initialize Android project
        run: make android-init
      - name: Apply product icons
        run: make icons
      - name: Build universal release APK
        run: make android-apk
      - name: Align and sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          unsigned="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          test -f "$unsigned"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p dist/release dist/android
          aligned="dist/android/app-universal-release-aligned.apk"
          "$build_tools/zipalign" -p -f 4 "$unsigned" "$aligned"
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            cp "$aligned" "dist/android/lerdr_${version}_universal-unsigned.apk"
            echo "ANDROID_KEYSTORE_BASE64 is not configured; uploaded the aligned unsigned APK only." >&2
            exit 0
          fi
          umask 077
          keystore="$RUNNER_TEMP/android-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "dist/release/lerdr_${version}_universal.apk" \
            "$aligned"
          "$build_tools/apksigner" verify --print-certs "dist/release/lerdr_${version}_universal.apk"
          rm -f "$keystore"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: |
            dist/release/lerdr_*.apk
            dist/android/lerdr_*-unsigned.apk
          retention-days: 1
          if-no-files-found: error

  publish:
    # Do not depend on the disabled mobile job: a skipped dependency skips
    # publication too. Restore this dependency when mobile CI is re-enabled.
    needs: [verify, build, native-smoke, android-apk]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-bundles
          path: dist/release
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: dist
      - name: Publish verified complete bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Candidates are tagged on dev, so a tag is only a stable release once
          # its commit is on main. Until then it ships as a prerelease, which the
          # relay's update check skips, and promotion flips it with
          # `gh release edit --prerelease=false --latest`.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            on_main=1
          else
            # 1 means "not on main"; any other status is a real git failure.
            status=$?
            test "$status" -eq 1 || exit "$status"
            on_main=0
          fi
          assets=(
            dist/release/checksums.txt
            dist/release/lerdr_*.tar.gz
          )
          for apk in dist/release/lerdr_*.apk; do
            [ -e "$apk" ] && assets+=("$apk")
          done
          if prerelease="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease \
              --jq .isPrerelease 2>/dev/null
          )"; then
            # A candidate tag moves as dev advances, so its release already
            # exists. Every bundle embeds the commit it was built from, so the
            # assets must be replaced: leaving them would advertise this tag
            # with a revision the relay refuses to install.
            if [ "$prerelease" = false ] && [ "$on_main" -eq 0 ]; then
              echo "Release $GITHUB_REF_NAME is already promoted; refusing to republish it from a commit that is not on main." >&2
              exit 1
            fi
            if [ "$on_main" -eq 1 ]; then
              visibility=(--latest --prerelease=false)
            else
              visibility=(--prerelease)
            fi
            # `gh release edit` cannot generate notes, so ask for the same body
            # the create path would have written.
            notes="$(
              gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                -f tag_name="$GITHUB_REF_NAME" \
                -f target_commitish="$GITHUB_SHA" \
                --jq .body
            )"
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --notes "$notes" \
              "${visibility[@]}"
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "${assets[@]}"
            exit 0
          fi
          if [ "$on_main" -eq 1 ]; then
            visibility=(--latest)
          else
            visibility=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "${visibility[@]}" \
            "${assets[@]}"
